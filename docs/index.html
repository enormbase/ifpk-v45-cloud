function estimateNetMonthly(gross){
 const annual=Number(gross);
 if(!Number.isFinite(annual)||annual<=0||annual>1e12)return null;
 const monthly=annual/12;
 const pension=Math.round(Math.min(Math.max(monthly,410000),6590000)*.0475);
 const health=Math.round(monthly*.03595);
 const care=Math.round(health*.1314);
 const employment=Math.round(monthly*.009);
 const insuranceYear=(pension+health+care+employment)*12;
 const deduction=Math.min(5000000,annual)*.7 + Math.max(0,Math.min(annual,15000000)-5000000)*.4 + Math.max(0,Math.min(annual,45000000)-15000000)*.15 + Math.max(0,Math.min(annual,100000000)-45000000)*.05 + Math.max(0,annual-100000000)*.02;
 // 1-person basic exemption, approximate no other deduction; progressive income tax.
 let taxable=Math.max(0,annual-deduction-insuranceYear-1500000);
 const brackets=[[14000000,.06],[50000000,.15],[88000000,.24],[150000000,.35],[300000000,.38],[500000000,.40],[1000000000,.42],[Infinity,.45]];
 let previous=0,annualTax=0;
 for(const [cap,rate] of brackets){let piece=Math.max(0,Math.min(taxable,cap)-previous);annualTax+=piece*rate;previous=cap;if(taxable<=cap)break;}
 const preliminaryCredit=annualTax<=1300000?annualTax*.55:715000+(annualTax-1300000)*.3;
 const creditCap=annual<=33000000?740000:annual<=70000000?Math.max(660000,740000-(annual-33000000)*.008):660000;
 annualTax=Math.max(0,annualTax-Math.min(preliminaryCredit,creditCap)-130000);
 const incomeTax=Math.round(annualTax/12),localTax=Math.round(incomeTax*.1);
 const net=Math.max(0,Math.round(monthly-pension-health-care-employment-incomeTax-localTax));
 return {gross:Math.round(monthly),pension,health,care,employment,incomeTax,localTax,net};
}

function customerLifeTimeline(){
 const a=customerApplied||CUSTOMER_BASE;
 const workNow=a.spouseWorkingNow==='yes',workFuture=a.spouseFutureWork==='yes';
 const workEndChanged=String(a.spouseWorkEnd)!==String(CUSTOMER_BASE.spouseWorkEnd);
 const workStartChanged=String(a.spouseWorkStart)!==String(CUSTOMER_BASE.spouseWorkStart);
 const goal=planInputs();
 const activeCar=goal.carPlanning!=='no',activeTravel=goal.travelPlanning!=='no';
 const events=[];
 const add=(date,title,desc,modified=false)=>{if(/^\d{4}-(0[1-9]|1[0-2])$/.test(String(date)))events.push({date,title,desc,modified});};
 if(!workNow&&workFuture)add(a.spouseWorkStart,'배우자 경제활동 시작',workStartChanged?'입력하신 시작 예정월 · 연금·건보 계산은 원본 유지':'배우자 소득활동 시작 예정',workStartChanged);
 if(workNow||workFuture)add(a.spouseWorkEnd,'배우자 은퇴 예정',workEndChanged?'입력하신 경제활동 종료 예정월 · 연금·건보 계산은 원본 유지':'배우자 경제활동 종료 예정 (원본 가정)',workEndChanged);
 if(activeCar)add(goal.carReplace,'🚗 자동차 교체','기존 차량 매각 후 희망 차량 구입');
 if(activeTravel)add(goal.travelDate,'✈️ 해외여행','여행 목적자금 활용');
 add(goal.homeMove,'🏠 주택 갈아타기','기존 주택 매각·대출 정산 후 이사');
 add('2056-04','본인 은퇴','만 63세 은퇴생활비 계산 시작');
 add('2057-01','배우자 국민연금 개시','기존 국민연금 수급 개시 가정');
 add('2058-05','본인 국민연금 개시','기존 국민연금 수급 개시 가정');
 events.sort((x,y)=>x.date.localeCompare(y.date)||x.title.localeCompare(y.title));
 return events.map(e=>`<div class="cp-event"><span class="cp-event-year">${esc(e.date.replace('-','.'))}</span><span class="cp-event-dot"></span><div><b>${esc(e.title)}</b>${e.modified?'<span class="cp-event-modified">입력 변경</span>':''}<p>${esc(e.desc)}</p></div></div>`).join('');
}

 const cpi=MODEL.indicators.find(x=>x.id==='CPI_GENERAL')||{ref:'2026-10',value:120.73};

 const cpiPeriod=String(cpi.ref||'2026-10').replace('-','년 ')+'월';
 const wageRef=String(wage.ref||'2020~2025년');
 return `<div class="cc-datagrid" aria-label="일반소비 외부 경제지표와 갱신 기준">
 <article class="cc-datacard"><div class="hm-minor-heading"><span class="hm-tag source">KOSIS · 통계 기반</span><b>① 생활비 물가: 전국 소비자물가지수</b></div>
 ${hmBasis([['자료 출처','KOSIS · 전국 소비자물가지수(CPI)'],['저장된 통계 기준월',cpiPeriod],['지수 저장값',Number(cpi.value).toLocaleString('ko-KR',{maximumFractionDigits:4})+' (지수)'],['CPI 활용','이미 지난 기간의 물가 변화로 앞으로의 생활비를 보정'],['미래 물가 가정','연 2.5% 고정'],['갱신 원칙','기존 2.5% 예상 물가와 실제 CPI의 차이를 미래 전망에 보정']])}
 <details class="hm-method-details cc-detail"><summary>생활비 물가가 어떻게 갱신되나요? <span class="hm-method-chevron" aria-hidden="true">⌄</span></summary><div class="hm-method-body">
 <div class="cc-flow"><span>① 새 CPI 발표 확인</span><i>→</i><span>② 기존 기준월과 실제 지수 비교</span><i>→</i><span>③ 이후 생활비 기준 보정</span><i>→</i><span>④ 미래 연 2.5% 가정 적용</span></div>
 <div class="cc-formula"><span>이미 관측된 CPI로 미래 생활비를 보정</span><strong>보정배율 = 실제 CPI 변화배율 ÷ 같은 기간의 기존 2.5% 예상배율</strong><small>원래 생활비 전망에 예상 물가상승분이 이미 반영되어 있으므로, 차이만 보정해 이중 계산을 막습니다. CPI는 고객의 실제 지출액이 아닙니다.</small></div>
 <div class="cc-formula"><span>앞으로 남은 기간의 생활비 전망</span><strong>미래 생활비 = CPI로 보정한 기준 생활비 × (1 + 0.025)<sup>남은 개월 수 / 12</sup></strong><small>지난 기간의 물가만 실제 CPI로 보정하고, 그 이후 미래 구간은 연 2.5% 가정을 유지합니다. 이미 지난 달의 소비를 다시 지출하게 하는 것이 아닙니다.</small></div>
 <p class="hm-method-reason"><b>재무설계 영향</b> · 일반소비는 미래 특정 시점의 목돈을 모으는 목적저축이 아니라 매달 지출하는 생활비입니다. CPI가 변하면 앞으로의 생활비와 가용현금 전망을 다시 검토하되, 이미 지난 달에 지출했다고 가정한 돈을 추가로 청구하거나 과거 저축액을 소급 변경하지 않습니다. 주택·양육·은퇴 후 생활비는 각 설계의 별도 기준을 유지합니다.</p>
 </div></details></article>
 <article class="cc-datacard"><div class="hm-minor-heading"><span class="hm-tag model">KOSIS · 검증 전용</span><b>② 임금상승률: 가정과 실제 흐름 비교</b></div>
 ${hmBasis([['활용 자료','KOSIS · 상용근로자 임금 통계'],['현재 보관된 참고 시계열','건설업 · '+wageRef],['보관된 통계 기반 참고 상승률',Number(wage.value).toFixed(2)+'%'],['고객 적용 명목 임금상승률','연 2.5% 고정'],['새 자료 발표 시','통계 추세 확인·2.5% 가정과 비교'],['미래 소득 자동 변경','하지 않음 · 검증용만 수집']])}
 <details class="hm-method-details cc-detail"><summary>임금 통계는 왜 검증에만 쓰나요? <span class="hm-method-chevron" aria-hidden="true">⌄</span></summary><div class="hm-method-body">
 <p class="hm-method-lead">개별 고객의 소득은 직종·경력·근로조건 등에 따라 달라지므로, <b>전국 또는 특정 업종의 평균 임금 변화를 고객 소득상승률로 자동 대체하지 않아요.</b></p>
 <div class="cc-flow"><span>① 새 임금 통계 수집</span><i>→</i><span>② 실측 추세 계산·비교</span><i>→</i><span>③ 가정의 적절성 검토</span><i>→</i><span>④ 고객 소득은 2.5% 유지</span></div>
 <p class="hm-method-reason"><b>검증 기준</b> · 현재 표시한 약 ${Number(wage.value).toFixed(2)}%는 <b>건설업 관련 저장 참고값</b>이며, 전체 상용근로자의 평균 상승률을 대표한다고 단정하지 않습니다. 비교할 때는 명목임금과 명목소득상승률을 같은 기준으로 살펴봐요.</p>
 <p class="hm-method-reason"><b>고정 원칙</b> · 새 임금 통계의 상승률이 2.5%보다 높거나 낮아져도 고객의 미래 명목 임금상승률은 <b>연 2.5%로 유지</b>합니다. 실제 반영 여부는 별도 의사결정 사항입니다.</p>
 </div></details></article></div>
 <div class="cc-implementation"><span class="cc-info-icon" aria-hidden="true">ⓘ</span><div><b>현재 웹사이트의 계산 범위와 향후 갱신 계획을 구분해 주세요.</b><p>위 내용은 <b>공식 통계가 새로 발표될 때 적용하려는 계산·검증 원칙</b>입니다. 지금 웹은 원본 저장 CPI를 표시하고, 미래 일반소비 계산에는 연 2.5% 경로를 사용합니다. 새 CPI를 외부지표 탭에 기록하면 일부 생활비 <b>민감도 미리보기</b>만 제공하며, 수집된 CPI를 은퇴 전 모든 월별 생활비에 자동 반영하거나 과거 확정 월을 고정하는 기능은 <b>아직 통합 연결되지 않았습니다.</b> 경제지표 수집 자체는 별도 클라우드 수집기가 담당하고 있습니다. 신규 임금 통계는 미래 소득을 변경하지 않습니다.</p></div></div>
 <div class="cc-data-link"><button type="button" class="hm-link-button" data-hm-open-data>경제지표 기준월·수집 이력 살펴보기 ↗</button></div>`;
}

function previewSpendingNow(){
 if(!spendDraft)return;
 const start=spendDraftStart||selectedEditableMonth();
 const plan=proposedEvents(spendDraft,start);
 const raw=unmodifiedMonthly(start)||{};
 const fixed=spendingTotal(spendDraft,'fixed'),variable=spendingTotal(spendDraft,'variable'),total=fixed+variable;
 const delta=monthSpendChange(start,plan);
 const expense=Number(raw.expense||0)+delta;
 const income=Number(raw.income||0)+Number(raw.pension||0);
 const available=income-expense;
 const goals=Number(raw.retSave||0)+Number(raw.houseSave||0)+Number(raw.carSave||0)+Number(raw.travelSave||0);
 const free=available-goals;
 // The cumulative figure includes all previously saved consumption changes plus
 // this unsaved draft from its selected start month. No changes before that month.
 const liveCash=spendingCheckpoint(start,plan,start).endCash;
 const cash=Number.isFinite(liveCash)?liveCash:Number(raw.cash||0);
 for(const [id,value] of [['fixed-subtotal',fixed],['variable-subtotal',variable],['spend-general',total],['spend-all',expense],['spend-available',available],['spend-free',free]]){
  const el=$('#'+id);if(el){el.textContent=KRW(value);if(id==='spend-free')el.classList.toggle('negative',free<0);}
 }
 const cumulative=$('#spend-cumulative'),cumulativeLabel=$('#spend-cumulative-label'),cumCard=$('#spend-cumulative-card');
 if(cumulative&&cumulativeLabel&&cumCard){
   const isDeficit=cash<0;
   cumulativeLabel.textContent=isDeficit?'이 시점까지 누적된 현금 부족':'이 시점까지 누적된 현금 여유';
   cumulative.textContent=KRW(Math.abs(cash));
   cumulative.classList.toggle('negative',isDeficit);
   cumCard.classList.toggle('has-deficit',isDeficit);
   cumCard.classList.toggle('has-surplus',!isDeficit);
   const caption=$('#spend-cumulative-caption');
   if(caption)caption.textContent=`2026년 11월~${start.slice(0,4)}년 ${Number(start.slice(5))}월 누적 · 저장 전 예상`;
 }
 const box=$('#scenario-live-summary');if(box){
  const prevEvents=spendEvents().filter(e=>e.date<start);
  const preceding=expensePlanAt(start,prevEvents);
  const relative=total-spendingTotal(preceding);
  const final=spendingCheckpoint('2056-03',plan,start);
  box.innerHTML=`<b>${relative===0?'직전 소비계획과 같은 금액입니다.':`직전 계획보다 월 ${KRW(Math.abs(relative))} ${relative>0?'더 쓰는':'덜 쓰는'} 조정입니다.`}</b> 시작월 목표저축 <b>${KRW(goals)}</b>은 그대로 유지하면 <b>${free>=0?`이번 달 ${KRW(free)}이 남습니다.`:`이번 달 ${KRW(-free)}이 부족합니다.`}</b><br><span class="small">${start}부터 다음 변경 전까지 적용됩니다. 변경 후 은퇴 전 전체 기간에서 누적 현금 부족이 나타나는 달: <b>${final.deficitMonths}개월</b>. 원본 시트는 변경하지 않습니다.</span>`;
 }
 renderForecastComparison();
 previewCashFix(dkey(app.year,app.month),spendDraft,start);
}

function flowYearMonths(y){
 const entries=[];
 for(let month=1;month<=12;month++){
   const date=dkey(y,month);if(date<'2026-11'||date>'2077-03')continue;
   const m=monthInfo(date);if(!m)continue;
   const income=Number(m.income||0)+Number(m.pension||0);
   const expense=Number(m.expense||0);
   const goals=Number(m.retSave||0)+Number(m.houseSave||0)+Number(m.carSave||0)+Number(m.travelSave||0);
   const event=Number(m.homeEvent||0)+Number(m.carEvent||0)+Number(m.tripEvent||0);
   const transfers=Number(m.eventTransfer||0)+Number(m.retDraw||0);
   const balance=Math.round(Number(m.net||0)-goals+transfers);
   const cum=Number(m.cash||0);
   const fmt=n=>KRW(Math.abs(Math.round(n)));
   const v=(label,num,kind='')=>`<span class="flow-month-cell ${kind}"><small>${label}</small><b>${fmt(num)}</b></span>`;
   const result=(label,num)=>`<span class="flow-month-cell ${num<0?'is-negative':'is-positive'}"><small>${label}</small><b>${num<0?'− ':''}${fmt(num)}</b></span>`;
   entries.push(`<div class="flow-month-row" role="row">
     <div class="flow-month-cell flow-month-date" role="rowheader"><strong>${month}월</strong><small>${date>='2056-04'?'은퇴 후':'은퇴 전'}</small></div>
     ${v('현금유입',income)}${v('생활·의무지출',expense)}${v('목적저축',goals)}
     ${result('월 잉여·부족',balance)}${result('누적 현금',cum)}
     <button type="button" class="flow-month-detail" data-flow-month="${date}" aria-label="${y}년 ${month}월 현금흐름 자세히 보기">자세히 보기 →</button>
   </div>`);
 }
 return `<div class="flow-month-breakdown" id="flow-year-detail-${y}">
   <div class="flow-month-breakdown-head"><div><b>${y}년 월별 현금흐름</b><p>월별 현금유입·지출·목적저축과 잉여·부족액을 확인해요. <b>자세히 보기</b>를 누르면 해당 월의 계산 과정으로 이동합니다.</p></div><span>${entries.length}개월</span></div>
   <div class="flow-month-table" role="table" aria-label="${y}년 월별 현금흐름">
     <div class="flow-month-row flow-month-thead" role="row"><span>월</span><span>현금유입</span><span>생활·의무지출</span><span>목적저축</span><span>월 잉여·부족</span><span>누적 현금</span><span>상세</span></div>
     ${entries.join('')||'<div class="flow-month-empty">해당 연도의 월별 계산 자료가 없습니다.</div>'}
   </div>
   <p class="flow-month-note">※ 이 표의 잉여·부족액은 <b>큰 일시지출과 기존 목적자금 사용·은퇴자산 인출까지 반영한 결과</b>입니다. 주택·자동차·여행처럼 일시지출이 있는 달은 상단 ‘월별 계산’에서 세부 항목을 확인하세요. 연도별 위쪽 금액은 기준계획, 펼친 월별 값은 현재 웹에 적용된 변경안을 포함할 수 있습니다.</p>
 </div>`;
}

function flowBrief(dt){
 const m=dt>='2026-11'&&dt<='2077-03'?monthInfo(dt):null, pre=dt<'2056-04';
 const goal=m?['retSave','houseSave','carSave','travelSave'].reduce((a,k)=>a+Number(m[k]||0),0):0;
 const net=m?Math.round(Number(m.net||0)-goal+Number(m.eventTransfer||0)+Number(m.retDraw||0)):null;
 const cum=m?Number(m.cash||0):null;
 const kpi=(label,amount,note,kind='')=>`<div class="flow-summary-tile ${kind}"><span>${label}</span><strong>${amount}</strong><small>${note}</small></div>`;
 return `<div class="flow-overview-grid" aria-label="선택한 달의 핵심 현금흐름">
 ${kpi('선택월 예상 잉여·부족',net===null?'조회기간 외':`${net<0?'부족 ':''}${KRW(Math.abs(net))}`,net===null?'2026년 11월~2077년 3월에 제공됩니다.':'그달의 수입·지출·저축 및 자금이전을 반영한 금액입니다.',`focus ${net!==null&&net<0?'is-short':''}`)}
 ${kpi('이 시점까지 누적 현금',cum===null?'—':`${cum<0?'부족 ':''}${KRW(Math.abs(cum))}`,cum===null?'분석기간의 월을 선택해 주세요.':cum<0?'계획 시작부터 이어진 누적 현금 부족입니다.':'계획 시작부터 이 시점까지 남은 현금입니다.',cum!==null&&cum<0?'is-attention':'')}
 ${kpi(pre?'이번 달 4대 목적저축':'이번 달 은퇴자산 인출',m?KRW(pre?goal:Number(m.retDraw||0)):'—',pre?'은퇴·주택·차량·여행 적립 계획입니다.':'연금 외 생활비를 충당하기 위한 자산 인출입니다.')}
 </div>`;

function logsOf(id){
  const rows=new Map();
  for(const row of persistent.logs||[]){if(row.id===id)rows.set(row.date,row);}

}

  const row=(label,v,isResult=false)=>`<div class="${isResult?'v46-rate-result':''}"><dt>${label}</dt><dd>${v}</dd></div>`;

function cpiCardsV47(st){

  const status=st?.latestRuns||[];
  const get=id=>records.find(x=>x.id===id);
  const run=id=>status.find(x=>x.id===id);
  const fmt=x=>Number.isFinite(Number(x))?Number(x).toLocaleString('ko-KR',{maximumFractionDigits:4}):'—';
  const specs=[
    {id:'CPI_CAR',icon:'🚗',name:'대형승용차 물가지수',months:3,method:'MA3',plan:'자동차 교체설계',approved:115.83},
    {id:'CPI_TRAVEL',icon:'✈️',name:'해외단체여행비 물가지수',months:12,method:'MA12',plan:'해외여행설계',approved:125.4608},
  ];

    if(!ok)return `<article class="v46-rate-card"><div class="v46-rate-card-top"><strong>${x.icon} ${x.name}</strong><small>${x.months}개월 이동평균</small></div><div class="v46-rate-empty">공식 품목별 CPI 수집·검증 대기 중 · ${esc(r?.status||a?.status||'미수집')}. 확인된 자료가 없으면 과거 수치를 최신값처럼 표시하지 않아요.</div></article>`;
    return `<article class="v46-rate-card"><div class="v46-rate-card-top"><strong>${x.icon} ${x.name}</strong><small>${esc(a.lastMonth||'—')} 기준</small></div><div class="v46-rate-primary">${fmt(a.value)}<small>지수</small></div><p class="v46-rate-intro">공식 ECOS 월별 지수 ${x.months}개를 평균한 ${x.method} · 경과기간 물가 비교 참고치.</p><dl class="v46-rate-rows"><div><dt>최신 월별 원지수</dt><dd>${fmt(a.lastObservedIndex)}</dd></div><div><dt>이동평균 구간</dt><dd>${esc(a.windowStart||'—')} ~ ${esc(a.lastMonth||'—')}</dd></div><div class="v46-rate-result"><dt>${x.method} · ${x.months}개월 산술평균</dt><dd>${fmt(a.value)}</dd></div><div><dt>확정계획의 기준 이동평균</dt><dd>${fmt(x.approved)}</dd></div><div><dt>기준 이동평균 대비 변화율</dt><dd>${((a.value/x.approved-1)*100)>=0?'+':''}${((a.value/x.approved-1)*100).toFixed(2)}%</dd></div></dl><p class="v46-rate-code">${esc('ECOS '+(a.sourceCode||'901Y009')+' · API '+(a.lastRetrievedAt||'—'))}<br>자동 계산 참고값 · ${x.plan}의 확정 목표금액은 유지</p></article>`;
  }).join('');
  return `<section class="v46-rate-section" aria-labelledby="v47-cpi-title"><div class="v46-rate-head"><div><span class="v46-rate-kicker">V47 · 품목별 CPI 자동수집 및 이동평균</span><h3 id="v47-cpi-title">자동차·해외여행 물가를 따로 확인</h3><p>ECOS 통계표 901Y009의 공식 품목명·코드를 매번 검증 → Supabase 원장 → 3·12개월 이동평균</p></div><span class="v46-rate-pill">공식 확정계획 미반영 · 모니터링</span></div><div class="v46-rate-grid">${detail}</div><p class="v46-rate-foot">자동차의 현재 비교지표는 기존 V46과 동일한 ‘대형승용차’야. 다른 6개 차종별 CPI 통합은 별도 모델 검증 후 진행해. 해외여행은 ‘해외단체여행비’ 계열만 사용하며, 미래 미경과기간 연 2.5% 가정과 6개월 재설계 승인 원칙은 유지해.</p></section>`;
}

async function v44Connect(showNotice=false){

 try{

  const a=await fetch(statusPath,{cache:'no-store'});if(!a.ok)throw Error('상태 HTTP '+a.status);
  const b=await fetch(dataPath,{cache:'no-store'});if(!b.ok)throw Error('원장 HTTP '+b.status);

  if(!['ifpk-collector-v44','ifpk-collector-v45'].includes(status.format)||json.format!=='ifpk-public-indicators')throw Error('IFPK 수집기 응답 형식이 아닙니다');

function mean(arr){return arr.reduce((a,b)=>a+b,0)/arr.length}
function implied(id){const l=logsOf(id);const nums=l.map(x=>+x.value).filter(Number.isFinite);const last=n=>nums.slice(-n);if(id==='CPI_CAR'&&nums.length>=3)return {name:'최근 3개월 이동평균',value:mean(last(3)),unit:'지수',basis:'기록한 월별 관측값 3개 사용'};if(id==='CPI_TRAVEL'&&nums.length>=12)return {name:'최근 12개월 이동평균',value:mean(last(12)),unit:'지수',basis:'기록한 월별 관측값 12개 사용'};if(id==='DEPOSIT'&&nums.length>=60)return {name:'최근 60개월 세후 평균',value:mean(last(60))*.846,unit:'%',basis:'세전 평균×(1−0.154)'};if(id==='MORTGAGE'&&nums.length>=120)return {name:'5년 70% / 10년 30%',value:mean(last(60))*.7+mean(last(120))*.3,unit:'%',basis:'최근 60·120개월 평균 가중'};if(id==='CPI_GENERAL'&&nums.length>=1)return {name:'최근 발표 CPI',value:nums.at(-1),unit:'지수',basis:'기록된 최신 관측값'};if(nums.length>=1)return {name:'최근 등록값',value:nums.at(-1),unit:l.at(-1)?.unit||'',basis:'기록된 최신 관측값 · 시트 반영 전'};return null}

function v51ReviewPanel(){
 const c=v50ReviewContext();

 const h=r.house;
 const money=n=>Number.isFinite(Number(n))?Math.round(n).toLocaleString('ko-KR')+'원':'—';
 const signed=n=>n>0?'+'+money(n):n<0?'−'+money(Math.abs(n)):'0원';
 const stage=(r.ledger.ready?'<span class="v511-state ok">605개월 기준자료 검산 완료</span>':'<span class="v511-state warn">기준자료 점검 필요</span>');
 const labels={partial:'부분 시험',fixed:'가정 유지',pending:'계산 대기'};
 const areas=r.approval.areas.map(a=>`<div class="v511-area"><div class="v511-area-head"><b>${esc(a.name)}</b><span class="v511-state ${a.status==='partial'?'mid':a.status==='fixed'?'neutral':'warn'}">${labels[a.status]||'확인 필요'}</span></div><p><b>${esc(a.label)}</b></p><small>${esc(a.details)}</small></div>`).join('');
 const preview=c.preview.ready?`<div class="v511-kpis"><div><span>주택 이사 전 월 저축</span><b>${money(c.preview.before.monthlySaving)} → ${money(c.preview.after.monthlySaving)}</b><small>${signed(c.preview.differences.monthlySaving)}</small></div><div><span>이사에 필요한 자기자금</span><b>${money(c.preview.before.ownCashGoal)} → ${money(c.preview.after.ownCashGoal)}</b><small>${signed(c.preview.differences.ownCashGoal)}</small></div></div>`:`<p class="v511-note">아직 클라우드의 검증된 주택 비교자료가 없어 금액 변경을 표시하지 않았습니다. ${esc(c.preview.reason||'')}</p>`;
 const months=h.ready?`<div class="v511-kpis"><div><span>대비되는 605개월 원장</span><b>${h.months}개월 검산</b><small>2026.11~2077.03 · 주택 시나리오만</small></div><div><span>변경 가정이 있는 달</span><b>${h.changedMonthCount}개월</b><small>주택목적 저축·이사·상환 항목</small></div><div><span>은퇴 전 누적현금 음수인 달</span><b>${h.baseDeficitCount} → ${h.deficitCount}개월</b><small>기존 스냅샷 ↔ 주택 부분 시험값</small></div></div>`:`<p class="v511-note">주택 부분 월별 시험 계산 보류: ${esc(h.reason||'조건 미확인')}</p>`;
 const examples=h.ready?`<details class="v511-extra"><summary>주택 변화가 월별 가용현금에 미치는 영향 살펴보기</summary><div class="table-wrap"><table class="v50-review-table"><thead><tr><th>조회월</th><th>기존 월말 가용현금</th><th>주택 변경 가정 시</th><th>차이</th></tr></thead><tbody>${h.examples.map(x=>`<tr><td>${esc(x.month)}</td><td>${money(x.beforeCash)}</td><td>${money(x.afterCash)}</td><td>${signed(x.afterCash-x.beforeCash)}</td></tr>`).join('')}</tbody></table></div><p class="v511-foot">이 표는 저축 추가액이 은퇴 전 일반현금에 미치는 효과를 월별로 연결한 <b>주택 부분 시험 계산</b>입니다. 은퇴자산 수익·퇴직연금·세금·자녀양육비 등은 재계산하지 않았으며, 은퇴 후 일반현금 잔액에 남는 영향만 이월했습니다. 따라서 전체 생애 재무설계 확정값으로 사용할 수 없습니다.</p></details>`:'';
 const basis=r.indexBases.filter(x=>x.available&&!x.ready);

 return `<section class="v511-review" id="v51-replanning"><div class="v511-head"><div><span class="eyebrow">V51.1 · HALF-YEAR REVIEW</span><h3>6개월 정기 재설계 · 분야별 점검</h3><p>현재 계획과 새로운 지표를 비교하되, 검증이 끝나기 전에는 기존 재무계획을 바꾸지 않습니다.</p></div><span class="v511-state warn">공식 적용 전</span></div>

 <h4>② 새 지표 적용 시 일부 변경 미리보기</h4>${preview}${months}${examples}${basisWarning}
 <div class="v511-locked"><b>새 재무계획 공식 적용은 아직 사용할 수 없습니다.</b><p>은퇴·주택·소비·양육·자동차·여행을 공통 계산모델로 재산출하고 모든 자금잔액·연금·현금흐름이 일치하는지 검증한 뒤 활성화해야 합니다. 현재 전체요약 남색 영역 및 생애현금흐름표의 공식 수치는 유지됩니다.</p></div>
 <div class="v50-review-actions"><button type="button" class="v50-secondary" disabled title="6개 분야 통합 재계산·검증이 완료되어야 사용할 수 있습니다">새 계획 공식 적용 · 통합 검증 전</button></div>

function csvRows(text){const lines=[];let row=[],word='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){word+='"';i++;}else q=!q;}else if(c===','&&!q){row.push(word);word='';}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(word);word='';if(row.some(s=>String(s).trim()))lines.push(row);row=[];}else word+=c;}if(word||row.length){row.push(word);lines.push(row)}return lines;}
function moneyNumber(x){if(typeof x==='number')return x;let s=String(x||'').replace(/₩|원|,/g,'').trim();if(!s||s==='-'||s==='#N/A')return 0;let n=Number(s);return Number.isFinite(n)?n:0;}
function readMonthRows(csv,kind){let rows=csvRows(csv),arr={};for(const r of rows){let d=(r[0]||'').trim();if(!/^\d{4}-\d{2}$/.test(d))continue;if(kind==='main'&&r.length>=22){let c=i=>moneyNumber(r[i]);arr[d]={income:c(2),pension:c(3),expense:c(4)+c(5),homeEvent:c(6),carEvent:c(7),tripEvent:c(8),net:c(10),retSave:c(11),houseSave:c(12),carSave:c(13),travelSave:c(14),houseBal:c(15),carBal:c(16),travelBal:c(17),eventTransfer:c(18),retDraw:c(19),cash:c(20),purpose:c(21),shortfall:c(22),source:'내가 올린 구글시트 월별 CSV'};}if(kind==='retire'&&r.length>=14){let c=i=>moneyNumber(r[i]);arr[d]={living:c(2),pension:c(5),insurance:c(6),withdraw:c(9),balance:c(13)};}}return arr;}
function logRecords(records,method='파일'){let n=0;for(let row of records){let id=String(row.id||row.indicator||'').trim();let date=String(row.date||'').slice(0,7);let v=Number(row.value);if(!MODEL.indicators.some(e=>e.id===id)||!/^\d{4}-(0[1-9]|1[0-2])$/.test(date)||!Number.isFinite(v))continue;persistent.logs=persistent.logs.filter(x=>!(x.id===id&&x.date===date));persistent.logs.push({id,date,value:v,method,recordedAt:new Date().toISOString()});n++;}save();return n;}

if($('#api-endpoint'))$('#api-endpoint').onchange=e=>{let value=e.target.value.trim();if(value&&!value.startsWith('https://')){notify('HTTPS 읽기 전용 API 주소만 입력해 줘.');return;}persistent.apiUrl=value;save();};if($('#test-api'))$('#test-api').onclick=async()=>{const url=$('#api-endpoint').value.trim();if(!url)return notify('연결할 서버 JSON 주소를 먼저 입력해 줘.');if(!url.startsWith('https://'))return notify('HTTPS 주소만 입력할 수 있어.');persistent.apiUrl=url;save();try{const r=await fetch(url,{cache:'no-store',credentials:'omit'});if(!r.ok)throw Error('HTTP '+r.status);let n=processApiJson(await r.json());app.apiStatus='연결 확인';notify('서버 응답에서 '+n+'건 기록했어.');render();}catch(err){notify('서버 연결 실패: '+err.message)}};if($('#export-logs'))$('#export-logs').onclick=()=>download('IFPK_지표갱신이력.json',JSON.stringify({format:'ifpk-public-indicators',exportedAt:new Date().toISOString(),records:persistent.logs},null,2),'application/json;charset=utf-8');}
function printableReport(){
 const old={...app};
 const parts=[];
 const section=(label,html)=>`<section class="print-report-section"><h2 class="print-section-title">${label}</h2>${html}</section>`;
 try{
   parts.push('<div class="print-report-front"><div class="eyebrow">IFPK · LIFE PLAN REPORT</div><h1>우리 가족의 생애 재무설계 보고서</h1><p>기준 시나리오 · 2026년 11월 / 출력 시점의 웹 변경사항 반영 범위 내 표시</p><p>원본 시트: '+esc(MODEL.updated)+' · 국세·보험·연금·대출규제 등 미연동 항목은 원본 가정 유지</p></div>');
   parts.push(section('01 · 전체요약',summaryPage()));
   parts.push(section('02 · 고객정보',customerPage()));
   let no=3;
   for(const goal of ['은퇴','주택','소비','양육','자동차','해외여행']){
     app.goal=goal==='자동차'||goal==='해외여행'?'소비':goal;
     if(goal==='자동차'||goal==='해외여행')app.consumeArea=goal;
     if(goal==='소비')app.consumeArea='일반소비';
     parts.push(section(String(no++).padStart(2,'0')+' · '+goal+'설계',goalPage()));
   }
   parts.push(section('09 · 생애현금흐름 및 연간 자산 전망',flowPage()));
   parts.push(section('10 · AI 검증 및 모델 한계',checkPage()));
   parts.push(`<section class="print-report-section"><h2 class="print-section-title">계산 범위 및 데이터 출처</h2><p>구글시트 원본: ${esc(anchor)}</p><p>생활비·주택·자동차·해외여행은 일부 웹 시나리오 변경이 반영됩니다. 은퇴·DC·국민연금·건강보험·대출 규제 및 장기 순자산 장부는 별도 재계산 미연동이며 원본 스냅샷을 따릅니다. 세전 연봉 변경만으로 세후 현금유입을 덮어쓰지 않습니다.</p></section>`);
   return parts.join('');
 }finally{Object.assign(app,old);}
}
function launchPrint(mode){
 const dlg=$('#print-choice');if(dlg.open)dlg.close();
 const root=$('#print-root');
 document.body.dataset.printMode=mode;
 if(mode==='full'){
   root.innerHTML=printableReport();
   root.setAttribute('aria-hidden','false');
 }else{root.innerHTML='';root.setAttribute('aria-hidden','true');}
 // Give the engine one paint cycle before opening the native print dialog.
 requestAnimationFrame(()=>requestAnimationFrame(()=>window.print()));
}
function cleanupPrint(){delete document.body.dataset.printMode;const root=$('#print-root');if(root){root.innerHTML='';root.setAttribute('aria-hidden','true');}}
window.addEventListener('afterprint',cleanupPrint);
function render(){let hash=location.hash.replace('#','');if(TABS.some(x=>x[0]===hash))app.tab=hash;$('#nav').innerHTML=TABS.map(([id,name])=>`<a href="#${id}" class="${id===app.tab?'active':''}" aria-current="${id===app.tab?'page':'false'}">${name}</a>`).join('');$('#main').innerHTML=({summary:summaryPage,customer:customerPage,plans:goalPage,flow:flowPage,data:dataPage,checks:checkPage})[app.tab]();bind();}
$('#sheet-btn').href=anchor;$('#print-btn').onclick=()=>$('#print-choice').showModal();$('#print-current-choice').onclick=()=>launchPrint('current');$('#print-all-choice').onclick=()=>launchPrint('full');$('#print-cancel').onclick=()=>$('#print-choice').close();window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();if(V44_LOCAL||V45_CLOUD)v44Connect();
