name: IFPK V48 R-ONE region and table verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-rone:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run isolated R-ONE probe (read only)
        env:
          RONE_API_KEY: ${{ secrets.RONE_API_KEY }}
        run: python collector/rone_probe.py
